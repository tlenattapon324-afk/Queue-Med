<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <link rel="apple-touch-icon" href="/app-icon.png"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>เข้าสู่ระบบ — ระบบคิว</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0f1923;min-height:100vh;
      display:flex;align-items:center;justify-content:center;color:#fff}
    .wrap{width:100%;max-width:420px;padding:20px}
    .card{background:#1a2a3a;border:1px solid #1e3a5f;border-radius:20px;padding:42px 38px}

    .logo{text-align:center;margin-bottom:32px}
    .logo-hex{font-size:2.8rem;line-height:1;display:block;margin-bottom:10px}
    .logo-title{font-size:1.4rem;font-weight:700;color:#ffd54f}
    .logo-sub{font-size:.82rem;color:#455a64;margin-top:5px;letter-spacing:.5px}

    .field{margin-bottom:18px}
    .field label{display:block;font-size:.78rem;color:#90caf9;font-weight:600;margin-bottom:7px;letter-spacing:.3px}
    .field input{width:100%;background:#0f1923;border:1.5px solid #1e3a5f;border-radius:10px;
      padding:13px 16px;color:#fff;font-size:.95rem;font-family:inherit;transition:border-color .2s}
    .field input:focus{outline:none;border-color:#42a5f5}
    .field input::placeholder{color:#2e4a60}

    .btn-login{width:100%;background:linear-gradient(135deg,#42a5f5,#1565c0);color:#fff;
      border:none;border-radius:12px;padding:14px;font-size:1rem;font-weight:700;
      cursor:pointer;margin-top:6px;font-family:inherit;transition:opacity .2s;letter-spacing:.3px}
    .btn-login:hover{opacity:.88}
    .btn-login:disabled{opacity:.5;cursor:not-allowed}

    .err{background:rgba(239,83,80,.12);border:1px solid rgba(239,83,80,.35);
      color:#ef9a9a;border-radius:10px;padding:11px 15px;font-size:.85rem;
      margin-top:14px;display:none;line-height:1.5}
    .err.show{display:block}

    .divider{border:none;border-top:1px solid #1e3a5f;margin:26px 0}

    .btn-cfg{width:100%;background:transparent;border:1px solid #1e3a5f;color:#546e7a;
      border-radius:12px;padding:12px;font-size:.85rem;cursor:pointer;font-family:inherit;
      transition:all .2s;display:flex;align-items:center;justify-content:center;gap:7px}
    .btn-cfg:hover{border-color:#42a5f5;color:#90caf9;background:rgba(66,165,245,.05)}
    .cfg-icon{font-size:1rem}

    .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);
      border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;
      vertical-align:middle;margin-right:7px}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* Department selection modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;
      align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(3px);
      opacity:0;pointer-events:none;transition:opacity .25s}
    .modal-overlay.show{opacity:1;pointer-events:all}
    .modal{background:#1a2a3a;border:1px solid #1e3a5f;border-radius:20px;
      padding:36px 32px;width:100%;max-width:420px;transform:translateY(16px);transition:transform .25s}
    .modal-overlay.show .modal{transform:translateY(0)}
    .modal-title{font-size:1.15rem;font-weight:700;color:#ffd54f;margin-bottom:6px;text-align:center}
    .modal-sub{font-size:.82rem;color:#455a64;text-align:center;margin-bottom:24px;letter-spacing:.3px}
    .dept-list{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow-y:auto}
    .dept-list::-webkit-scrollbar{width:5px}
    .dept-list::-webkit-scrollbar-track{background:transparent}
    .dept-list::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:4px}
    .dept-btn{background:#0f1923;border:1.5px solid #1e3a5f;border-radius:12px;
      color:#cfd8dc;font-size:.95rem;font-family:inherit;padding:14px 18px;
      text-align:left;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:10px}
    .dept-btn:hover{border-color:#42a5f5;color:#fff;background:rgba(66,165,245,.08)}
    .dept-btn:active{background:rgba(66,165,245,.15)}
    .dept-icon{font-size:1.1rem;flex-shrink:0}
    .dept-loading{text-align:center;color:#546e7a;font-size:.9rem;padding:20px 0}
    .dept-err{color:#ef9a9a;font-size:.85rem;text-align:center;padding:10px 0}
  </style>
</head>
<body>

<!-- Department selection modal -->
<div class="modal-overlay" id="deptOverlay">
  <div class="modal">
    <div class="modal-title">เลือกห้องตรวจ</div>
    <div class="modal-sub" id="deptWelcome">กรุณาเลือกห้องตรวจที่ต้องการใช้งาน</div>
    <div class="dept-list" id="deptList">
      <div class="dept-loading">กำลังโหลด...</div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="card">
    <div class="logo">
      <span class="logo-hex">⬡</span>
      <div class="logo-title">ระบบคิว</div>
      <div class="logo-sub">ระบบบริหารคิวการบริการ</div>
    </div>

    <div class="field">
      <label>ชื่อผู้ใช้งาน</label>
      <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้งาน" autocomplete="username"/>
    </div>
    <div class="field">
      <label>รหัสผ่าน</label>
      <input type="password" id="password" placeholder="กรอกรหัสผ่าน" autocomplete="current-password"/>
    </div>

    <button class="btn-login" id="loginBtn" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div class="err" id="errMsg"></div>

    <div id="bmsToggleWrap" style="text-align:center;margin-top:16px">
      <a href="javascript:void(0)" onclick="toggleBmsBox()" style="color:#546e7a;font-size:.8rem;text-decoration:underline">เข้าสู่ระบบด้วย BMS Session</a>
    </div>
    <div id="bmsBox" style="display:none;margin-top:14px">
      <div class="field">
        <label>BMS Session ID</label>
        <input type="text" id="bmsSessionId" placeholder="วาง Session ID ที่นี่"/>
      </div>
      <button class="btn-login" id="bmsLoginBtn" onclick="doBmsLogin()" style="background:linear-gradient(135deg,#66bb6a,#2e7d32)">เข้าสู่ระบบด้วย BMS Session</button>
      <div class="err" id="bmsErrMsg"></div>
    </div>

    <hr class="divider"/>

    <button class="btn-cfg" onclick="location.href='/db-config.html'">
      <span class="cfg-icon">⚙</span> ตั้งค่าการเชื่อมต่อฐานข้อมูล
    </button>
  </div>
</div>

<script>
  // Auto-redirect if already logged in
  const _tok = sessionStorage.getItem('authToken');
  if (_tok) {
    fetch('/api/auth/verify', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ token: _tok })
    }).then(r => r.json()).then(d => { if (d.success) location.href = '/'; });
  }

  document.getElementById('username').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  // ── BMS Session login (ดู BMS-SESSION-SPECIFICATION.md) ────────────────
  // รองรับ 3 ทาง: URL parameter (?bms-session-id=), Cookie (7 วัน), และกรอกเอง
  function getBmsCookie() {
    const m = document.cookie.match(/(?:^|; )bms_session_id=([^;]*)/);
    return m ? decodeURIComponent(m[1]) : null;
  }
  function setBmsCookie(id) {
    const d = new Date(); d.setTime(d.getTime() + 7 * 24 * 60 * 60 * 1000);
    document.cookie = 'bms_session_id=' + encodeURIComponent(id) + '; expires=' + d.toUTCString() + '; path=/';
  }
  function clearBmsCookie() {
    document.cookie = 'bms_session_id=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
  }

  function toggleBmsBox() {
    const box = document.getElementById('bmsBox');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
    if (box.style.display === 'block') document.getElementById('bmsSessionId').focus();
  }

  document.getElementById('bmsSessionId').addEventListener('keydown', e => {
    if (e.key === 'Enter') doBmsLogin();
  });

  function doBmsLogin(sessionIdArg) {
    const sessionId = sessionIdArg || document.getElementById('bmsSessionId').value.trim();
    const btn   = document.getElementById('bmsLoginBtn');
    const errEl = document.getElementById('bmsErrMsg');
    errEl.classList.remove('show');

    if (!sessionId) {
      errEl.textContent = 'กรุณากรอก BMS Session ID';
      errEl.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>กำลังเข้าสู่ระบบ...';

    fetch('/api/auth/bms-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId })
    })
    .then(r => r.json())
    .then(d => {
      if (d.success) {
        setBmsCookie(sessionId);
        sessionStorage.setItem('authToken', d.token);
        sessionStorage.setItem('officerName', d.officer.name);
        fetchDepts(d.token, d.officer.name);
      } else {
        clearBmsCookie();
        errEl.textContent = d.message;
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'เข้าสู่ระบบด้วย BMS Session';
        document.getElementById('bmsBox').style.display = 'block';
      }
    })
    .catch(() => {
      errEl.textContent = 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'เข้าสู่ระบบด้วย BMS Session';
    });
  }

  // ตรวจ URL parameter ก่อน (ล้างออกจาก URL ทันที) จากนั้นค่อยตรวจ Cookie
  (function autoBmsLogin() {
    const params = new URLSearchParams(location.search);
    const urlSid = params.get('bms-session-id');
    if (urlSid) {
      params.delete('bms-session-id');
      const clean = location.pathname + (params.toString() ? '?' + params.toString() : '');
      history.replaceState({}, '', clean);
      toggleBmsBox();
      doBmsLogin(urlSid);
      return;
    }
    const cookSid = getBmsCookie();
    if (cookSid) {
      toggleBmsBox();
      doBmsLogin(cookSid);
    }
  })();

  function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('loginBtn');
    const errEl    = document.getElementById('errMsg');
    errEl.classList.remove('show');

    if (!username || !password) {
      errEl.textContent = 'กรุณากรอกชื่อผู้ใช้งานและรหัสผ่าน';
      errEl.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>กำลังเข้าสู่ระบบ...';

    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    })
    .then(r => r.json())
    .then(d => {
      if (d.success) {
        sessionStorage.setItem('authToken', d.token);
        sessionStorage.setItem('officerName', d.officer.name);
        fetchDepts(d.token, d.officer.name);
      } else {
        errEl.textContent = d.message;
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'เข้าสู่ระบบ';
      }
    })
    .catch(() => {
      errEl.textContent = 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'เข้าสู่ระบบ';
    });
  }

  function fetchDepts(token, officerName) {
    const overlay  = document.getElementById('deptOverlay');
    const listEl   = document.getElementById('deptList');
    const welcomeEl = document.getElementById('deptWelcome');
    welcomeEl.textContent = officerName + ' — กรุณาเลือกห้องตรวจ';
    listEl.innerHTML = '<div class="dept-loading">กำลังโหลด...</div>';
    overlay.classList.add('show');

    fetch('/api/officer/departments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token })
    })
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(d => {
      if (!d.success) {
        listEl.innerHTML = '<div class="dept-err">' + escHtml(d.message || 'โหลดข้อมูลไม่สำเร็จ') + '</div>';
        return;
      }
      const depts = d.departments || [];
      if (depts.length === 0) {
        listEl.innerHTML = '<div class="dept-err">ไม่พบห้องตรวจที่กำหนด</div>';
        return;
      }
      if (depts.length === 1) {
        selectDept(token, depts[0].depcode, depts[0].name);
        return;
      }
      listEl.innerHTML = '';
      depts.forEach(dept => {
        const btn = document.createElement('button');
        btn.className = 'dept-btn';
        btn.innerHTML = '<span class="dept-icon">🏥</span>' + escHtml(dept.name);
        btn.onclick = () => selectDept(token, dept.depcode, dept.name);
        listEl.appendChild(btn);
      });
    })
    .catch(err => {
      listEl.innerHTML = '<div class="dept-err">เกิดข้อผิดพลาด: ' + escHtml(err.message) + '</div>';
    });
  }

  function selectDept(token, depcode, deptName) {
    const listEl = document.getElementById('deptList');
    listEl.innerHTML = '<div class="dept-loading">กำลังโหลด...</div>';

    fetch('/api/auth/select-dept', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, depcode, deptName })
    })
    .then(r => r.json())
    .then(d => {
      if (d.success) {
        sessionStorage.setItem('currentDepcode', d.depcode);
        sessionStorage.setItem('currentDeptName', d.deptName);
        location.href = '/';
      } else {
        listEl.innerHTML = '<div class="dept-err">' + (d.message || 'เกิดข้อผิดพลาด') + '</div>';
      }
    })
    .catch(() => {
      listEl.innerHTML = '<div class="dept-err">เกิดข้อผิดพลาด กรุณาลองใหม่</div>';
    });
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
<div id="_uiPnl" style="position:fixed;bottom:16px;right:16px;z-index:10000;font-family:'Segoe UI',Tahoma,sans-serif">
  <button onclick="_uiToggle()" title="ปรับสีหน้าจอ" style="width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);background:rgba(13,31,51,.85);color:#90caf9;font-size:1.1rem;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)">🎨</button>
  <div id="_uiBox" style="display:none;position:absolute;bottom:48px;right:0;width:220px;background:#0d1f33;border:1px solid #1e3a5f;border-radius:14px;padding:14px 16px;box-shadow:0 4px 20px rgba(0,0,0,.6)">
    <div style="font-size:.8rem;color:#90caf9;font-weight:700;margin-bottom:12px">🎨 ปรับสีหน้าจอ</div>
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:.72rem;color:#ccc;margin-bottom:4px"><span>☀ ความสว่าง</span><span id="_brLbl" style="color:#ffd54f;font-weight:700">1.00</span></div>
      <input id="_brSlider" type="range" min="0.4" max="1.6" step="0.05" value="1" style="width:100%;accent-color:#ffd54f;cursor:pointer"/>
    </div>
    <div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;font-size:.72rem;color:#ccc;margin-bottom:4px"><span>🎨 ความสด</span><span id="_stLbl" style="color:#80deea;font-weight:700">1.20</span></div>
      <input id="_stSlider" type="range" min="0.3" max="2.5" step="0.05" value="1.2" style="width:100%;accent-color:#80deea;cursor:pointer"/>
    </div>
    <button onclick="_uiReset()" style="width:100%;background:rgba(255,255,255,.06);border:1px solid #1e3a5f;color:#90caf9;border-radius:8px;padding:6px;font-size:.75rem;cursor:pointer;font-family:inherit">↺ รีเซ็ต</button>
  </div>
</div>
<script>
(function(){
  var BK='qf_brightness',SK='qf_saturation';
  function _applyV(b,s){b=parseFloat(b)||1;s=parseFloat(s)||1.2;localStorage.setItem(BK,b);localStorage.setItem(SK,s);document.body.style.filter='brightness('+b+') saturate('+s+')';var bl=document.getElementById('_brLbl'),sl=document.getElementById('_stLbl'),bs=document.getElementById('_brSlider'),ss=document.getElementById('_stSlider');if(bl)bl.textContent=b.toFixed(2);if(bs)bs.value=b;if(sl)sl.textContent=s.toFixed(2);if(ss)ss.value=s;}
  window._applyGlobalColor=_applyV;
  function _applyF(){_applyV(parseFloat(localStorage.getItem(BK)||'1'),parseFloat(localStorage.getItem(SK)||'1.2'));}
  _applyF();
  fetch('/api/global-config').then(function(r){return r.json();}).then(function(d){if(d&&d.brightness!=null)_applyV(d.brightness,d.saturation);}).catch(function(){});
  window._uiToggle=function(){var b=document.getElementById('_uiBox');b.style.display=b.style.display==='none'?'block':'none';};
  window._uiReset=function(){_applyV(1,1.2);fetch('/api/global-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brightness:1,saturation:1.2})}).catch(function(){});};
  document.addEventListener('DOMContentLoaded',function(){_applyF();document.getElementById('_brSlider').oninput=function(){var b=parseFloat(this.value),s=parseFloat(localStorage.getItem(SK)||'1.2');_applyV(b,s);fetch('/api/global-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brightness:b,saturation:s})}).catch(function(){});};document.getElementById('_stSlider').oninput=function(){var b=parseFloat(localStorage.getItem(BK)||'1'),s=parseFloat(this.value);_applyV(b,s);fetch('/api/global-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brightness:b,saturation:s})}).catch(function(){});};});
})();
if(typeof socket!=='undefined')socket.on('global_config_updated',d=>{if(window._applyGlobalColor&&d&&d.brightness!=null)window._applyGlobalColor(d.brightness,d.saturation);});
</script>
</body>
</html>
